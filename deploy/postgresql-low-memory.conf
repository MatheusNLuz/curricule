# Starting profile for PostgreSQL + one Node process on a 1 GiB Linux machine.
# Include from postgresql.conf after checking existing instance settings.
# Requires restart for shared_buffers and max_connections. Not applied automatically.
listen_addresses = '127.0.0.1'
max_connections = 20
shared_buffers = 64MB
effective_cache_size = 256MB
work_mem = 2MB
maintenance_work_mem = 32MB
autovacuum_work_mem = 16MB
wal_buffers = 4MB
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 1
idle_in_transaction_session_timeout = 60s
