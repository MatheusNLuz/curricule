name: Build Linux release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://build:placeholder@127.0.0.1:5432/curricule
      DIRECT_URL: postgresql://build:placeholder@127.0.0.1:5432/curricule
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Build and package standalone
        run: |
          npm run build
          if find .next/standalone -maxdepth 1 -name '.env*' | grep -q .; then
            echo 'Environment file found in artifact' >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/RELEASE_COMMIT
          tar -C .next/standalone -czf curricule-linux-x64.tgz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curricule-linux-x64
          path: curricule-linux-x64.tgz
          retention-days: 7
          compression-level: 0
